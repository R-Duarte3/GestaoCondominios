{% extends "base.html" %}

{% block conteudo %}
<h2>Registar morador</h2>

{% if erro %}
<p class="erro">{{ erro }}</p>
{% endif %}

{% if moradias %}
<form method="post" action="{{ url_for('moradores.criar') }}">
    <div>
        <label for="nome">Nome</label>
        <input
            id="nome"
            name="nome"
            type="text"
            maxlength="100"
            value="{{ nome }}"
            required
        >
    </div>

    <div>
        <label for="nif">NIF</label>
        <input
            id="nif"
            name="nif"
            type="text"
            inputmode="numeric"
            pattern="[0-9]{9}"
            maxlength="9"
            value="{{ nif }}"
            required
        >
    </div>

    <div>
        <label for="telefone">Telefone</label>
        <input
            id="telefone"
            name="telefone"
            type="text"
            maxlength="20"
            value="{{ telefone }}"
        >
    </div>

    <div>
        <label for="email">Email</label>
        <input
            id="email"
            name="email"
            type="email"
            maxlength="100"
            value="{{ email }}"
        >
    </div>

    <div>
        <label for="tipo">Tipo</label>
        <select id="tipo" name="tipo" required>
            <option value="">-- Escolha o tipo --</option>
            <option value="proprietario" {% if tipo == "proprietario" %}selected{% endif %}>Proprietário</option>
            <option value="inquilino" {% if tipo == "inquilino" %}selected{% endif %}>Inquilino</option>
        </select>
    </div>

    <div>
        <label for="id_moradia">Moradia</label>
        <select id="id_moradia" name="id_moradia" required>
            <option value="">-- Escolha a moradia --</option>
            {% for moradia in moradias %}
            <option value="{{ moradia.id_moradia }}" {% if id_moradia == moradia.id_moradia|string %}selected{% endif %}>
                {{ moradia.identificacao }}
            </option>
            {% endfor %}
        </select>
    </div>

    <button type="submit">Guardar</button>
    <a href="{{ url_for('moradores.listar') }}">Cancelar</a>
</form>
{% else %}
<p>
    Ainda não existem moradias. Registe primeiro uma moradia em
    <a href="{{ url_for('moradias.formulario') }}">Registar moradia</a>.
</p>
{% endif %}
{% endblock %}
