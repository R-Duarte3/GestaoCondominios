{% extends "base.html" %}

{% block conteudo %}
<h2>Registar obra</h2>

{% if erro %}
<p class="erro">{{ erro }}</p>
{% endif %}

<form method="post" action="{{ url_for('obras.criar') }}">
    <div>
        <label for="descricao">Descrição</label>
        <input
            id="descricao"
            name="descricao"
            type="text"
            maxlength="200"
            value="{{ descricao }}"
            required
        >
    </div>

    <div>
        <label for="data_pedido">Data do pedido</label>
        <input
            id="data_pedido"
            name="data_pedido"
            type="date"
            value="{{ data_pedido }}"
            required
        >
    </div>

    <div>
        <label for="orcamento">Orçamento (€) (opcional)</label>
        <input
            id="orcamento"
            name="orcamento"
            type="number"
            step="0.01"
            min="0"
            value="{{ orcamento }}"
        >
    </div>

    <button type="submit">Guardar</button>
    <a href="{{ url_for('obras.listar') }}">Cancelar</a>
</form>
{% endblock %}
