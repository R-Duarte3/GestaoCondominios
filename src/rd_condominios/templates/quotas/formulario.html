{% extends "base.html" %}

{% block conteudo %}
<h2>Registar quota</h2>

{% if erro %}
<p class="erro">{{ erro }}</p>
{% endif %}

{% if moradias %}
<form method="post" action="{{ url_for('quotas.criar') }}">
    <div>
        <label for="id_moradia">Moradia</label>
        <select id="id_moradia" name="id_moradia" required>
            <option value="">-- Escolha a moradia --</option>
            {% for moradia in moradias %}
            <option value="{{ moradia.id_moradia }}" {% if id_moradia == moradia.id_moradia|string %}selected{% endif %}>
                {{ moradia.identificacao }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div>
        <label for="ano">Ano</label>
        <input
            id="ano"
            name="ano"
            type="number"
            min="2000"
            max="2100"
            value="{{ ano }}"
            required
        >
    </div>

    <div>
        <label for="mes">Mês</label>
        <select id="mes" name="mes" required>
            <option value="">-- Escolha o mês --</option>
            {% for numero in range(1, 13) %}
            <option value="{{ numero }}" {% if mes == numero|string %}selected{% endif %}>{{ numero }}</option>
            {% endfor %}
        </select>
    </div>

    <div>
        <label for="valor">Valor (€)</label>
        <input
            id="valor"
            name="valor"
            type="number"
            step="0.01"
            min="0"
            value="{{ valor }}"
            required
        >
    </div>

    <div>
        <label for="data_vencimento">Data de vencimento</label>
        <input
            id="data_vencimento"
            name="data_vencimento"
            type="date"
            value="{{ data_vencimento }}"
            required
        >
    </div>

    <button type="submit">Guardar</button>
    <a href="{{ url_for('quotas.listar') }}">Cancelar</a>
</form>
{% else %}
<p>
    Ainda não existem moradias. Registe primeiro uma moradia em
    <a href="{{ url_for('moradias.formulario') }}">Registar moradia</a>.
</p>
{% endif %}
{% endblock %}
